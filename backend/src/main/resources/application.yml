spring:
  application:
    name: Parade-ground-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/Parade-ground?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: 
  jackson:
    default-property-inclusion: non_null

langchain4j:
  open-ai:
    chat-model:
      api-key: ${OPENROUTER_API_KEY:}
      base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
      model-name: ${OPENROUTER_MODEL_NAME:qwen/qwen-plus}
      temperature: ${OPENROUTER_TEMPERATURE:0.2}
      max-tokens: ${OPENROUTER_MAX_TOKENS:4096}
      timeout: ${OPENROUTER_TIMEOUT:180s}
      max-retries: 0

server:
  port: 8123
  servlet:
    context-path: /api

mybatis-plus:
  mapper-locations: classpath*:/mapper/*.xml
  type-aliases-package: com.cyx.paradegroundbackend.model.entity
  configuration:
    map-underscore-to-camel-case: false
  global-config:
    db-config:
      table-underline: false
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  group-configs:
    - group: default
      paths-to-match: /**
      packages-to-scan: com.cyx.paradegroundbackend.controller

knife4j:
  enable: true
  setting:
    language: zh_cn
